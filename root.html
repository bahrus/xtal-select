<fieldset class=xtal-select-wrapper part=xtal-select-wrapper>
    <legend aria-label={{dataset.label}}>{{dataset.label}}</legend>
    <label>
        <span>{{dataset.label}}</span>
        <slot></slot>
    </label>
</fieldset>
<style>

    .xtal-select-wrapper {
        display: inline-block;
        --hover-highlight-color: #00bfff; /* bright blue */
        & select {
            appearance: base-select;
        };
    }
    .xtal-select-wrapper:has(select:focus){
        & legend {
            opacity: 1;
            transform: translateY(0);
            width: auto;
            padding-inline: auto;
        }
        & label>span {
            opacity: 0;
            transform: translateY(-10px); /* move up and fade out */
        }
    }
    .xtal-select-wrapper:hover {
        border-color:  var(--hover-highlight-color);
    }
    .xtal-select-wrapper {
        & legend {
            opacity: 0;
            transform: translateY(10px); /* slightly lower */
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 0px;
            padding-inline: 0px;
        }
        & label>span {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
        }
    }
    
</style>

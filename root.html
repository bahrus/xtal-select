<fieldset part=xtal-select-fieldset class=xtal-select-wrapper part=xtal-select-wrapper>
    <legend part=xtal-select-legend aria-label={{dataset.label}}>{{dataset.label}}</legend>
    <label part=xtal-select-label>
        <span part=xtal-select-label-span>{{dataset.label}}</span>
        <slot>
            <select></select>
        </slot>
    </label>
</fieldset>
<style>

    .xtal-select-wrapper {
        display: inline-block;
        --hover-highlight-color: #00bfff; /* bright blue */
        --transition-interval: 0.5s;
        --translate-length: 20px;
        --outer-width: 400px;
        --gap-after-label: 3px;
        --legend-padding: 2px;
        --box-sizing: border-box;
        --font-family: "Roboto", "Helvetica", "Arial", "sans-serif";
        --select-flex: 1;
        --select-border: 2px solid #dddddd;
        --select-background: #eeeeee;
        --select-padding: 10px;
        --select-transition: 0.4s;
        --select-hf-background: #dddddd;
        --select-pi-color: #999999;
        --select-pi-tansition: 0.4s rotate;
        --select-opi-rotate: 180deg;
        width: var(--outer-width);
        box-sizing: var(--box-sizing);
        font-family: var(--font-family);
        select, ::picker(select){
            appearance: base-select;
        }
        select {
            flex: var(--select-flex);
            min-width: 0; /* allows flex item to shrink below content size */
            padding: var(--select-padding);
            border: var(--select-border); 
            background: var(--select-background);
            transition: border-color var(--select-transition);
            option {
                display: flex;
                justify-content: flex-start;
                gap: 20px;

                border: 2px solid #dddddd;
                background: #eeeeee;
                padding: 10px;
                transition: 0.4s;
                .icon {
                    font-size: 1.6rem;
                    text-box: trim-both cap alphabetic;
                }
            }
            option:first-of-type {
                border-radius: 8px 8px 0 0;
            }

            option:last-of-type {
                border-radius: 0 0 8px 8px;
            }

            option:not(option:last-of-type) {
                border-bottom: none;
            }
            option:nth-of-type(odd) {
                background: white;
            }
            option:hover,
              option:focus {
                background: plum;
            }
            option:checked{
                font-weight: bold;
            }
            option::checkmark {
                order: 1;
                margin-left: auto;
                content: "☑️";
            }
            selectedcontent {
                .icon{
                    display: none;
                }
            }
        }
        select:hover, select:focus {
            background: var(--select-hf-background);
            
        }
        ::picker(select){
            border: none;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.4s allow-discrete;
            top: calc(anchor(bottom) + 1px);
            left: anchor(10%);
        }
        ::picker(select):popover-open {
            opacity: 1;
        }

        label {
            display: flex;
            align-items: center;
            width: 100%;
            
            & span {
                margin-right: var(--gap-after-label); 
            }
        }
    }
    .xtal-select-wrapper:has(select:focus){
        & legend {
            opacity: 1;
            transform: translateY(0);
            width: auto;
            padding-inline: var(--legend-padding);
        }
        & label>span {
            opacity: 0;
            transform: translateY(-var(--translate-length)); /* move up and fade out */
            max-width: 0px;
        }
    }
    .xtal-select-wrapper:hover {
        border-color:  var(--hover-highlight-color);
    }
    .xtal-select-wrapper {
        legend {
            opacity: 0;
            transform: translateY(var(--translate-length)); /* slightly lower */
            transition: opacity var(--transition-interval) ease, transform var(--transition-interval) ease;
            width: 0px;
            padding-inline: 0px;
        }
        label>span {
            opacity: 1;
            visibility: visible;
            display:inline-block;
            max-width: 200px;
            transition: 
                opacity var(--transition-interval) ease, 
                transform var(--transition-interval) ease, 
                visibility 0s linear var(--transition-interval),
                max-width var(--transition-interval) ease
            ;
                
        }
    }
    
</style>
